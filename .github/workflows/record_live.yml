# Save this in your repo as: .github/workflows/record_live.yml
# Started automatically by "Forward Telegram channel" when the channel goes live.
name: Record Telegram live

on:
  workflow_dispatch:

concurrency:
  group: record-live
  cancel-in-progress: false   # never stop a recording that is running

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 355        # GitHub's limit is 6 hours
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ffmpeg and Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q telethon "py-tgcalls>=3,<4" numpy
      - name: Record the live
        run: python record_live.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_LIVE: ${{ secrets.TG_SESSION_LIVE }}
